function norm(a){let m=[0,1,2].map(i=>Math.min(...a.map(p=>p[i])));return a.map(p=>p.map((v,i)=>v-m[i])).sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2])}
function norm2(a){let mx=Math.min(...a.map(p=>p[0])),my=Math.min(...a.map(p=>p[1]));return a.map(p=>[p[0]-mx,p[1]-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function same(a,b){return JSON.stringify(norm(a))===JSON.stringify(norm(b))}
function same2(a,b){return JSON.stringify(norm2(a))===JSON.stringify(norm2(b))}
function make(el,cells,x,y,s=1){el.innerHTML='';let a=norm(cells),d=[0,1,2].map(i=>Math.max(...a.map(p=>p[i]))+1),z=42;el.style.width=d[0]*z+'px';el.style.height=d[1]*z+'px';el.style.transform='rotateX('+x+'deg) rotateY('+y+'deg) scale('+s+')';a.forEach(([i,j,k])=>{let c=document.createElement('div');c.className='voxel';c.style.transform='translate3d('+((i-(d[0]-1)/2)*z)+'px,'+((j-(d[1]-1)/2)*z)+'px,'+((k-(d[2]-1)/2)*z)+'px)';c.innerHTML='<i class="face front"></i><i class="face back"></i><i class="face right"></i><i class="face left"></i><i class="face topface"></i><i class="face bottom"></i>';el.appendChild(c)})}
function distract(a,seed){let b=norm(a).map(p=>[...p]);b.splice((seed+1)%b.length,1);let set=new Set(b.map(p=>p.join(',')));for(let x=0;x<4;x++)for(let y=0;y<4;y++)for(let z=0;z<4;z++){let p=[x,y,z];if(!set.has(p.join(','))&&b.some(q=>Math.abs(q[0]-x)+Math.abs(q[1]-y)+Math.abs(q[2]-z)===1)){b.push(p);return b}}return a}
function sectionAt(shape,axis,layer){let pair=axis===0?[1,2]:axis===1?[0,2]:[0,1];return norm2(norm(shape).filter(p=>p[axis]===layer).map(p=>[p[pair[0]],p[pair[1]]]))}
function mutateSection(shape,delta,seed){let a=norm2(shape).map(p=>[...p]);if(delta<0&&a.length>1){a.splice(seed%a.length,1);return norm2(a)}let used=new Set(a.map(p=>p.join(',')));for(const p of a)for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){let q=[p[0]+d[0],p[1]+d[1]];if(q[0]>=0&&q[1]>=0&&!used.has(q.join(','))){a.push(q);return norm2(a)}}return a}
function renderGrid(el,cells,kind){let a=norm2(cells),cols=Math.max(...a.map(p=>p[0]))+1,rows=Math.max(...a.map(p=>p[1]))+1,used=new Set(a.map(p=>p.join(',')));el.innerHTML='';el.style.gridTemplateColumns='repeat('+cols+', 20px)';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let c=document.createElement('span');c.className=kind+'-cell'+(used.has(x+','+y)?' filled':'');el.appendChild(c)}}
function transformNet(cells,turns,flip){return norm2(cells.map(p=>{let x=p[0],y=p[1];if(flip)x=-x;for(let i=0;i<turns;i++){let t=x;x=-y;y=t}return[x,y]}))}
function markSlice(el,shape,axis,layer){let a=norm(shape);Array.from(el.children).forEach((cube,i)=>{if(a[i][axis]===layer)cube.classList.add('slice-hit')})}
function renderMain(){let stage=document.getElementById('stage'),controls=document.querySelector('.controls');if(mode==='section'&&currentSection){stage.classList.add('section-stage');stage.innerHTML=sectionSvg(currentSection.art);controls.style.display='none';return}stage.classList.remove('section-stage');controls.style.display='flex';if(!document.getElementById('main'))stage.innerHTML='<div class="view" id="main"></div>';let shape=mode==='net'?[[0,0,0]]:shapes[n],el=document.getElementById('main');make(el,shape,rx,ry);if(mode==='net')el.querySelectorAll('.voxel').forEach(c=>c.classList.add('net-cube'))}
function commonStart(label,total=5){document.getElementById('round').textContent=label+' '+(n+1)+' / '+total;document.getElementById('score').textContent='正解 '+score;document.getElementById('bar').style.width=(((n+1)/total)*100)+'%';document.getElementById('msg').className='message';document.getElementById('next').disabled=true;document.getElementById('next').textContent='次の問題 →';document.getElementById('next').onclick=nextStep}
function setPanels(left,leftHint,right,rightHint,instruction){document.getElementById('leftTitle').textContent=left;document.getElementById('leftHint').textContent=leftHint;document.getElementById('rightTitle').textContent=right;document.getElementById('rightHint').textContent=rightHint;document.getElementById('instruction').textContent=instruction}
function beginSolid(){locked=false;currentPlane=null;setPanels('この立体をよく観察','ドラッグでも回せます','同じ立体はどれ？','向きが違っても形は同じ','矢印キーでも回転できます');let a=shapes[n],answer=norm(a.map(rots[(n*3+1)%rots.length])),opts=[answer,distract(a,n),distract(a,(n+2)%a.length)].sort(()=>Math.random()-.5);commonStart('ROUND');document.getElementById('msg').textContent='立体を回して、形のつながりを見比べよう。';renderMain();let box=document.getElementById('choices');box.innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.dataset.correct=String(same(o,answer));b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span class="mini"><span class="view"></span></span>';make(b.querySelector('.view'),o,-25,35,.8);b.onclick=()=>pick(b);box.appendChild(b)})}
function beginSection(){locked=false;currentSection=sectionRounds[n];currentPlane=null;let spec=currentSection;setPanels(spec.solid+'を観察','赤い点が切断位置','断面はどの形？','切り口の形を選ぼう','赤い点を通る平面で切ると、断面は何の形？');commonStart('断面問題',sectionRounds.length);document.getElementById('msg').textContent='赤い点を通る平面で切った断面を選んでください。';renderMain();let box=document.getElementById('choices');box.innerHTML='';let opts=spec.options.slice().sort(()=>Math.random()-.5);opts.forEach((kind,i)=>{let b=document.createElement('button');b.className='choice section-choice';b.dataset.correct=String(kind===spec.answer);b.setAttribute('aria-label',sectionLabels[kind]);b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span class="profile-preview">'+sectionShapeSvg(kind)+'</span><span class="profile-name">'+sectionLabels[kind]+'</span>';b.onclick=()=>pick(b);box.appendChild(b)})}
function netKey(cells){return norm2(cells).map(p=>p.join(',')).join(';')}
function netCanonical(cells){let variants=[];for(let flip=0;flip<2;flip++)for(let turns=0;turns<4;turns++)variants.push(netKey(transformNet(cells,turns,flip)));return variants.sort()[0]}
function allHexominoes(){let sets=[[[0,0]]];for(let size=1;size<6;size++){let next=new Map();for(const cells of sets){let used=new Set(cells.map(p=>p.join(',')));for(const p of cells)for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){let q=[p[0]+d[0],p[1]+d[1]],key=q.join(',');if(q[0]<0||q[1]<0||used.has(key))continue;let shape=norm2([...cells,q]);next.set(netCanonical(shape),shape)}}sets=[...next.values()]}return sets}
function cubeNet(cells){let dirs=[[1,0],[-1,0],[0,1],[0,-1]],states=new Map([[cells[0].join(','),[[1,0,0],[0,1,0],[0,0,1]]]]),queue=[cells[0]],byKey=new Set(cells.map(p=>p.join(',')));while(queue.length){let p=queue.shift(),state=states.get(p.join(',')),[u,v,n]=state;for(let i=0;i<4;i++){let d=dirs[i],q=[p[0]+d[0],p[1]+d[1]],key=q.join(',');if(!byKey.has(key))continue;let next=i===0?[u.map((x,j)=>-n[j]),v,u]:i===1?[n,v,u.map(x=>-x)]:i===2?[u,n,v.map(x=>-x)]:[u,v.map(x=>-n[x]),v];if(i===3)next=[u,v.map((x,j)=>-n[j]),v];let prior=states.get(key);if(prior){if(JSON.stringify(prior)!==JSON.stringify(next))return false}else{states.set(key,next);queue.push(q)}}}let normals=new Set([...states.values()].map(s=>s[2].join(',')));return states.size===6&&normals.size===6}
const netPool=allHexominoes(),cubeNets=netPool.filter(cubeNet),foldingTraps=netPool.filter(net=>!cubeNet(net));
function beginNet(){locked=false;currentPlane=null;setPanels('立方体を観察','ドラッグで向きを変えられます','立方体になる展開図はどれ？','6マスの折り重なりを見抜こう','4つの候補はすべて6マス。折ったときに面が重なる形に注意しよう。');commonStart('展開図 ROUND');document.getElementById('msg').textContent='4つの展開図から、立方体に組み立てられるものを選んでください。';renderMain();let correct=cubeNets[(n+Math.floor(Math.random()*cubeNets.length))%cubeNets.length],others=[];for(let i=0;i<foldingTraps.length&&others.length<3;i++){let pick=foldingTraps[(n*7+i*9+Math.floor(Math.random()*foldingTraps.length))%foldingTraps.length];if(!others.some(x=>netCanonical(x)===netCanonical(pick)))others.push(pick)}let opts=[{cells:correct,valid:true},...others.map(cells=>({cells,valid:false}))].sort(()=>Math.random()-.5),box=document.getElementById('choices');box.innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.dataset.correct=String(o.valid);b.setAttribute('aria-label','展開図 '+String.fromCharCode(65+i));b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span class="net-preview"></span>';renderGrid(b.querySelector('.net-preview'),o.cells,'net');b.onclick=()=>pick(b);box.appendChild(b)})}
function begin(){if(mode==='solid')beginSolid();else if(mode==='section')beginSection();else beginNet()}
function pick(b){if(locked)return;locked=true;let ok=b.dataset.correct==='true',msg=document.getElementById('msg');if(ok){score++;b.classList.add('correct');b.insertAdjacentHTML('beforeend','<span class="mark">✓</span>');msg.textContent=mode==='section'?'正解！赤い点を通る平面の断面です。':mode==='net'?'正解！6つの正方形を折ると立方体になります。':'正解！向きを変えてもブロックのつながりは同じです。';msg.classList.add('good')}else{b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<span class="mark">×</span>');msg.textContent=mode==='section'?'おしい！赤い点を通る切断面と立体の交わりを考えよう。':mode==='net'?'おしい！折ったときに面が重ならず、立方体を作れる形か考えよう。':'おしい！ブロックの数や出っ張りの位置を見比べよう。';msg.classList.add('bad');document.querySelectorAll('.choice').forEach(x=>{if(x.dataset.correct==='true')x.classList.add('correct')})}document.getElementById('score').textContent='正解 '+score;document.getElementById('next').disabled=false}
function nextStep(){let total=mode==='section'?sectionRounds.length:5;if(n<total-1){n++;begin();return}let msg=document.getElementById('msg'),b=document.getElementById('next');msg.textContent='おつかれさま！ '+total+'問中 '+score+' 問正解';msg.className='message good';b.textContent='もう一度遊ぶ ↻';b.disabled=false;b.onclick=()=>{n=0;score=0;rx=-25;ry=35;begin()}}
function selectMode(next){mode=next;n=0;score=0;rx=-25;ry=35;document.getElementById('modeChooser').hidden=true;document.getElementById('gameArea').hidden=false;begin()}
document.querySelectorAll('.mode-card').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));document.getElementById('changeMode').onclick=()=>{document.getElementById('gameArea').hidden=true;document.getElementById('modeChooser').hidden=false};document.getElementById('left').onclick=()=>turn('y',-25);document.getElementById('right').onclick=()=>turn('y',25);document.getElementById('up').onclick=()=>turn('x',25);
function turn(axis,delta){if(mode==='section')return;if(axis==='y')ry+=delta;else rx=Math.max(-75,Math.min(75,rx+delta));renderMain()}
document.getElementById('stage').onpointerdown=e=>{if(mode==='section')return;drag=[e.clientX,e.clientY];e.currentTarget.setPointerCapture(e.pointerId)};document.getElementById('stage').onpointermove=e=>{if(mode==='section'||!drag)return;ry+=(e.clientX-drag[0])*.65;rx=Math.max(-75,Math.min(75,rx-(e.clientY-drag[1])*.55));drag=[e.clientX,e.clientY];renderMain()};document.getElementById('stage').onpointerup=()=>drag=null;window.onkeydown=e=>{if(e.key==='ArrowLeft')turn('y',-20);if(e.key==='ArrowRight')turn('y',20);if(e.key==='ArrowUp')turn('x',20);if(e.key==='ArrowDown')turn('x',-20)};
begin();</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>(async()=>{try{const version="spatial-game-v9",keys=await caches.keys();if(!keys.includes(version)){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>new URL(r.scope).pathname.startsWith("/spatial-game/")).map(r=>r.unregister()));await Promise.all(keys.filter(k=>k.startsWith("spatial-game-")).map(k=>caches.delete(k)))}await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"})}catch(e){console.error(e)}})())}</script></body></html>
